<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 
                0 8px 10px -6px rgba(0,0,0,0.05);
      --radius: 16px;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      color: var(--text-main);
    }

    .hero-banner {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      height: 320px;
      display: flex;
      align-items: center;
      padding: 40px;
      box-shadow: var(--shadow);
      margin: 40px auto;
      max-width: 1000px;
    }

    .hero-banner img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .hero-banner::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(
        90deg, 
        rgba(15, 23, 42, 0.85) 0%, 
        rgba(15, 23, 42, 0.4) 100%
      );
      z-index: 2;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      color: #ffffff;
      max-width: 600px;
    }

    .hero-content h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .hero-content p {
      color: #cbd5e1;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .action-cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1000px;
      margin: 40px auto;
    }

    .action-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e2e8f0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .action-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px -10px rgba(79, 70, 229, 0.15);
    }

    .action-card-info h3 {
      font-size: 1.05rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .action-card-info span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <!-- Hero Banner -->
  <div class="hero-banner">
    <img src="https://picsum.photos/1200/320" alt="Banner">
    <div class="hero-content">
      <h1>Welcome to Student Registration System</h1>
      <p>Manage students, courses, and reports easily.</p>
      <a href="registration.html" class="btn">Get Started</a>
    </div>
  </div>

  <!-- Action Cards -->
  <div class="action-cards-container">
    <div class="action-card">
      <div class="action-card-info">
        <h3>Students</h3>
        <span>View and manage student records</span>
      </div>
      <a href="students.html" class="btn">Open</a>
    </div>

    <div class="action-card">
      <div class="action-card-info">
        <h3>Courses</h3>
        <span>Browse and manage courses</span>
      </div>
      <a href="courses.html" class="btn">Open</a>
    </div>

    <div class="action-card">
      <div class="action-card-info">
        <h3>Reports</h3>
        <span>Generate and view reports</span>
      </div>
      <a href="reports.html" class="btn">Open</a>
    </div>
  </div>

</body>
</html>
