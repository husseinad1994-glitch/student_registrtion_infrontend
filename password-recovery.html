<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Recovery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8; /* خلفية فاتحة */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    form {
      background-color: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 350px;
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 8px 0 4px;
      font-weight: bold;
      color: #2c3e50;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      background-color: #f9f9f9;
      color: #2c3e50;
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    .reset {
      background-color: #27ae60; /* أخضر */
      color: #fff;
    }
    .reset:hover {
      background-color: #1e8449;
    }
    .cancel {
      background-color: #e74c3c; /* أحمر */
      color: #fff;
    }
    .cancel:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>
  <form>
    <h2>Password Recovery</h2>
    <label>Registered Email</label>
    <input type="email" placeholder="Enter registered email" required>

    <label>New Password</label>
    <input type="password" placeholder="Enter new password" required>

    <label>Confirm Password</label>
    <input type="password" placeholder="Confirm password" required>

    <div class="buttons">
      <button type="submit" class="reset">Reset Password</button>
      <button type="button" class="cancel">Cancel</button>
    </div>
  </form>
</body>
</html>
