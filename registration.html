<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      min-height: 100vh;
      background-color: #f0f4f8;
      color: #2c3e50;
    }
    .sidebar {
      width: 220px;
      background-color: #34495e;
      color: #fff;
      height: 100vh;
      padding-top: 20px;
      position: fixed;
      left: 0;
      top: 0;
    }
    .sidebar button {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      background: none;
      color: #fff;
      text-align: left;
      cursor: pointer;
      font-weight: bold;
    }
    .sidebar button:hover {
      background-color: #1abc9c;
    }
    .main {
      flex: 1;
      margin-left: 220px;
      padding: 20px;
    }
    .form-section {
      margin-bottom: 20px;
      background-color: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .form-section h3 {
      margin-bottom: 10px;
      color: #2c3e50;
    }
    label {
      display: block;
      margin: 8px 0 4px;
      font-weight: bold;
      color: #2c3e50;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      background-color: #f9f9f9;
      color: #2c3e50;
    }
    .buttons {
      margin-top: 20px;
    }
    .buttons button {
      padding: 10px 20px;
      margin-right: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    .register {
      background-color: #27ae60;
      color: #fff;
    }
    .register:hover {
      background-color: #1e8449;
    }
    .cancel {
      background-color: #e74c3c;
      color: #fff;
    }
    .cancel:hover {
      background-color: #c0392b;
    }
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }
      .main {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <button onclick="changeLanguage('en')">English</button>
    <button onclick="changeLanguage('ar')">العربية</button>
    <button id="dashboard">Dashboard</button>
    <button id="students">Students</button>
    <button id="courses">Courses</button>
    <button id="reports">Reports</button>
    <button id="settings">Settings</button>
    <button id="logout">Logout</button>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="form-section">
      <h3 id="personalTitle">Personal Information</h3>
      <label for="fullname" id="lblFullname">Full Name</label>
      <input type="text" id="fullname" placeholder="Enter full name">

      <label for="studentid" id="lblStudentid">Student ID</label>
      <input type="text" id="studentid" placeholder="Enter student ID">

      <label for="email" id="lblEmail">Email</label>
      <input type="email" id="email" placeholder="Enter email">

      <label for="phone" id="lblPhone">Phone</label>
      <input type="tel" id="phone" placeholder="Enter phone">
    </div>

    <div class="form-section">
      <h3 id="academicTitle">Academic Information</h3>
      <label for="program" id="lblProgram">Program</label>
      <select id="program">
        <option value="">Select program</option>
