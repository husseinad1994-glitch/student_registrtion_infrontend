<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      min-height: 100vh;
      background-color: #f0f4f8; /* خلفية فاتحة */
      color: #2c3e50;           /* كتابة داكنة */
    }
    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: #34495e; /* أزرق غامق */
      color: #fff;
      height: 100vh;
      padding-top: 20px;
      position: fixed;
      left: 0;
      top: 0;
    }
    .sidebar button {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      background: none;
      color: #fff;
      text-align: left;
      cursor: pointer;
      font-weight: bold;
    }
    .sidebar button:hover {
      background-color: #1abc9c; /* أخضر فاتح عند المرور */
    }
    /* Main Content */
    .main {
      flex: 1;
      margin-left: 220px;
      padding: 20px;
    }
    .form-section {
      margin-bottom: 20px;
      background-color: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .form-section h3 {
      margin-bottom: 10px;
      color: #2c3e50;
    }
    label {
      display: block;
      margin: 8px 0 4px;
      font-weight: bold;
      color: #2c3e50;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      background-color: #f9f9f9;
      color: #2c3e50;
    }
    .buttons {
      margin-top: 20px;
    }
    .buttons button {
      padding: 10px 20px;
      margin-right: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    .register {
      background-color: #27ae60;
      color: #fff;
    }
    .register:hover {
      background-color: #1e8449;
    }
    .cancel {
      background-color: #e74c3c;
      color: #fff;
    }
    .cancel:hover {
      background-color: #c0392b;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }
      .main {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <button>Dashboard</button>
    <button>Students</button>
    <button>Courses</button>
    <button>Reports</button>
    <button>Settings</button>
    <button>Logout</button>
  </div>

  <!-- Main Content -->
  <div class="main">
    <!-- Personal Information -->
    <div class="form-section">
      <h3>Personal Information</h3>
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" placeholder="Enter full name">

      <label for="studentid">Student ID</label>
      <input type="text" id="studentid" placeholder="Enter student ID">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email">

      <label for="phone">Phone</label>
      <input type="tel" id="phone" placeholder="Enter phone">
    </div>

    <!-- Academic Information -->
    <div class="form-section">
      <h3>Academic Information</h3>
      <label for="program">Program</label>
      <select id="program">
        <option value="">Select program</option>
        <option value="CS">Computer Science</option>
        <option value="IT">Information Technology</option>
        <option value="ENG">Engineering</option>
      </select>

      <label for="level">Level</label>
      <select id="level">
        <option value="">Select level</option>
        <option value="Undergraduate">Undergraduate</option>
        <option value="Postgraduate">Postgraduate</option>
      </select>
    </div>

    <!-- Buttons -->
    <div class="buttons">
      <button class="register" onclick="registerStudent()">Register</button>
      <button class="cancel" onclick="cancelForm()">Cancel</button>
    </div>
  </div>

  <script>
    function registerStudent() {
      const fullname = document.getElementById('fullname').value;
      const studentid = document.getElementById('studentid').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const program = document.getElementById('program').value;
      const level = document.getElementById('level').value;

      if (!fullname || !studentid || !email || !phone || !program || !level) {
        alert("⚠️ Please fill all fields!");
        return;
      }

      alert(`✅ Student Registered:\nName: ${fullname}\nID: ${studentid}\nEmail: ${email}\nPhone: ${phone}\nProgram: ${program}\nLevel: ${level}`);
    }

    function cancelForm() {
      document.getElementById('fullname').value = "";
      document.getElementById('studentid').value = "";
      document.getElementById('email').value = "";
      document.getElementById('phone').value = "";
      document.getElementById('program').value = "";
      document.getElementById('level').value = "";
      alert("❌ Form cleared!");
    }
  </script>
</body>
</html>
