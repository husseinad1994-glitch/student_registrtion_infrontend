<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: 220 px;
      background: #2c3e50;
      color: #fff;
      height: 100 vh;
      padding-top: 20 px;
    }
    .sidebar button {
      display: block;
      width: 100 %;
      padding: 12 px;
      border: none;
      background: none;
      color: #fff;
      text-align: left;
      cursor: pointer;
    }
    .sidebar button:hover {
      background: #34495e;
    }
    /* Main Content */
    .main {
      flex: 1;
      padding: 20 px;
    }
    h2 {
      margin-bottom: 20 px;
      color: #2c3e50;
    }
    .form-section {
      margin-bottom: 20 px;
    }
    .form-section h3 {
      margin-bottom: 10 px;
      color: #34495e;
    }
    label {
      display: block;
      margin: 8 px 0 4 px;
    }
    input, select {
      width: 100 %;
      padding: 8 px;
      margin-bottom: 12 px;
      border: 1 px solid #ccc;
      border-radius: 4 px;
    }
    .buttons {
      margin-top: 20 px;
    }
    .buttons button {
      padding: 10 px 20 px;
      margin-right: 10 px;
      border: none;
      border-radius: 4 px;
      cursor: pointer;
    }
    .register {
      background: #27ae60;
      color: #fff;
    }
    .cancel {
      background: #e74c3c;
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <button>Dashboard</button>
    <button>Students</button>
    <button>Courses</button>
    <button>Reports</button>
    <button>Settings</button>
    <button>Logout</button>
  </div>

  <!-- Main Content -->
  <div class="main">
 

    <!-- Personal Information -->
    <div class="form-section">
      <h3>Personal Information</h3>
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" placeholder="Enter full name">

      <label for="studentid">Student ID</label>
      <input type="text" id="studentid" placeholder="Enter student ID">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email">

      <label for="phone">Phone</label>
      <input type="tel" id="phone" placeholder="Enter phone">
    </div>

    <!-- Academic Information -->
    <div class="form-section">
      <h3>Academic Information</h3>
      <label for="program">Program</label>
      <select id="program">
        <option value="">Select program</option>
        <option value="CS">Computer Science</option>
        <option value="IT">Information Technology</option>
        <option value="ENG">Engineering</option>
      </select>

      <label for="level">Level</label>
      <select id="level">
        <option value="">Select level</option>
        <option value="Undergraduate">Undergraduate</option>
        <option value="Postgraduate">Postgraduate</option>
      </select>
    </div>

    <!-- Buttons -->
    <div class="buttons">
      <button class="register" onclick="registerStudent()">Register</button>
      <button class="cancel" onclick="cancelForm()">Cancel</button>
    </div>
  </div>

  <script>
    function registerStudent() {
      const fullname = document.getElementById('fullname').value;
      const studentid = document.getElementById('studentid').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const program = document.getElementById('program').value;
      const level = document.getElementById('level').value;

      if (!fullname || !studentid || !email || !phone || !program || !level) {
        alert("⚠️ Please fill all fields!");
        return;
      }

      alert(`✅ Student Registered:\nName: ${fullname}\nID: ${studentid}\nEmail: ${email}\nPhone: ${phone}\nProgram: ${program}\nLevel: ${level}`);
    }

    function cancelForm() {
      document.getElementById('fullname').value = "";
      document.getElementById('studentid').value = "";
      document.getElementById('email').value = "";
      document.getElementById('phone').value = "";
      document.getElementById('program').value = "";
      document.getElementById('level').value = "";
      alert("❌ Form cleared!");
    }
  </script>
</body>
</html>
