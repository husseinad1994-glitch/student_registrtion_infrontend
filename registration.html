<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      background-color: #f5f5dc; /* بيج */
      color: #5c4033;           /* بني */
    }
    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: #deb887; /* بني فاتح */
      color: #5c4033;
      height: 100vh;
      padding-top: 20px;
    }
    .sidebar button {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      background: none;
      color: #5c4033;
      text-align: left;
      cursor: pointer;
      font-weight: bold;
    }
    .sidebar button:hover {
      background-color: #f5deb3; /* بيج أفتح عند المرور */
    }
    /* Main Content */
    .main {
      flex: 1;
      padding: 20px;
    }
    .form-section {
      margin-bottom: 20px;
      background-color: #fff8dc; /* Cornsilk */
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(92,64,51,0.2);
    }
    .form-section h3 {
      margin-bottom: 10px;
      color: #5c4033;
    }
    label {
      display: block;
      margin: 8px 0 4px;
      font-weight: bold;
      color: #5c4033;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #a0522d;
      border-radius: 6px;
      font-size: 14px;
      background-color: #fffaf0;
      color: #5c4033;
    }
    .buttons {
      margin-top: 20px;
    }
    .buttons button {
      padding: 10px 20px;
      margin-right: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    .register {
      background-color: #8b4513; /* بني غامق */
      color: #fff;
    }
    .register:hover {
      background-color: #5c4033;
    }
    .cancel {
      background-color: #a0522d; /* بني محمر */
      color: #fff;
    }
    .cancel:hover {
      background-color: #5c4033;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <button onclick="changeLanguage('ar')">العربية</button>
    <button onclick="changeLanguage('en')">English</button>
    <button id="dashboard">Dashboard</button>
    <button id="students">Students</button>
    <button id="courses">Courses</button>
    <button id="reports">Reports</button>
    <button id="settings">Settings</button>
    <button id="logout">Logout</button>
  </div>

  <!-- Main Content -->
  <div class="main">
    <!-- Personal Information -->
    <div class="form-section">
      <h3>Personal Information</h3>
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" placeholder="Enter full name">

      <label for="studentid">Student ID</label>
      <input type="text" id="studentid" placeholder="Enter student ID">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email">

      <label for="phone">Phone</label>
      <input type="tel" id="phone" placeholder="Enter phone">
    </div>

    <!-- Academic Information -->
    <div class="form-section">
      <h3>Academic Information</h3>
      <label for="program">Program</label>
      <select id="program">
        <option value="">Select program</option>
        <option value="CS">Computer Science</option>
        <option value="IT">Information Technology</option>
        <option value="ENG">Engineering</option>
      </select>

      <label for="level">Level</label>
      <select id="level">
        <option value="">Select level</option>
        <option value="Undergraduate">Undergraduate</option>
        <option value="Postgraduate">Postgraduate</option>
      </select>
    </div>

    <!-- Buttons -->
    <div class="buttons">
      <button class="register" onclick="registerStudent()">Register</button>
      <button class="cancel" onclick="cancelForm()">Cancel</button>
    </div>
  </div>

  <script>
    function registerStudent() {
      const fullname = document.getElementById('fullname').value;
      const studentid = document.getElementById('studentid').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const program = document.getElementById('program').value;
      const level = document.getElementById('level').value;

      if (!fullname || !studentid || !email || !phone || !program || !level) {
        alert("⚠️ Please fill all fields!");
        return;
      }

      alert(`✅ Student Registered:\nName: ${fullname}\nID: ${studentid}\nEmail: ${email}\nPhone: ${phone}\nProgram: ${program}\nLevel: ${level}`);
    }

    function cancelForm() {
      document.getElementById('fullname').value = "";
      document.getElementById('studentid').value = "";
      document.getElementById('email').value = "";
      document.getElementById('phone').value = "";
      document.getElementById('program').value = "";
      document.getElementById('level').value = "";
      alert("❌ Form cleared!");
    }
  </script>
</body>
</html>
