<script>
  let currentLang = 'en';

  function changeLanguage(lang) {
    currentLang = lang;

      document.getElementById("lblPhone").textContent = "الهاتف";

      document.getElementById("academicTitle").textContent = "المعلومات الأكاديمية";
      document.getElementById("lblProgram").textContent = "البرنامج";
      document.getElementById("lblLevel").textContent = "المستوى";

      document.getElementById("btnRegister").textContent = "تسجيل";
      document.getElementById("btnCancel").textContent = "إلغاء";
    } else {
      document.getElementById("dashboard").textContent = "Dashboard";
      document.getElementById("students").textContent = "Students";
      document.getElementById("courses").textContent = "Courses";
      document.getElementById("reports").textContent = "Reports";

      document.getElementById("lblEmail").textContent = "Email";
      document.getElementById("lblPhone").textContent = "Phone";

      document.getElementById("academicTitle").textContent = "Academic Information";
      document.getElementById("lblProgram").textContent = "Program";
      document.getElementById("lblLevel").textContent = "Level";

      document.getElementById("btnRegister").textContent = "Register";
      document.getElementById("btnCancel").textContent = "Cancel";
    }
  }
</script>
