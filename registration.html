<!DOCTYPE html>
<html lang="en">
<head>
  <!-- أزرار تغيير اللغة داخل الـ sidebar -->
<div class="sidebar">
  <button onclick="changeLanguage('ar')">العربية</button>
  <button onclick="changeLanguage('en')">English</button>
  <button>Dashboard</button>
  <button>Students</button>
  <button>Courses</button>
  <button>Reports</button>
  <button>Settings</button>
  <button>Logout</button>
</div>

<script>
  function changeLanguage(lang) {
    if (lang === 'ar') {
      document.querySelectorAll('h3')[0].textContent = "المعلومات الشخصية";
      document.querySelectorAll('label')[0].textContent = "الاسم الكامل";
      document.querySelectorAll('label')[1].textContent = "الرقم الجامعي";
      document.querySelectorAll('label')[2].textContent = "البريد الإلكتروني";
      document.querySelectorAll('label')[3].textContent = "الهاتف";
      document.querySelectorAll('h3')[1].textContent = "المعلومات الأكاديمية";
      document.querySelectorAll('label')[4].textContent = "البرنامج";
      document.querySelectorAll('label')[5].textContent = "المستوى";
      document.querySelector('.register').textContent = "تسجيل";
      document.querySelector('.cancel').textContent = "إلغاء";
    } else {
      document.querySelectorAll('h3')[0].textContent = "Personal Information";
      document.querySelectorAll('label')[0].textContent = "Full Name";
      document.querySelectorAll('label')[1].textContent = "Student ID";
      document.querySelectorAll('label')[2].textContent = "Email";
      document.querySelectorAll('label')[3].textContent = "Phone";
      document.querySelectorAll('h3')[1].textContent = "Academic Information";
      document.querySelectorAll('label')[4].textContent = "Program";
      document.querySelectorAll('label')[5].textContent = "Level";
      document.querySelector('.register').textContent = "Register";
      document.querySelector('.cancel').textContent = "Cancel";
    }
  }
</script>

  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: 220px;          /* بدون مسافة */
      background: #2c3e50;
      color: #fff;
      height: 100vh;         /* بدون مسافة */
      padding-top: 20px;     /* بدون مسافة */
    }
    .sidebar button {
      display: block;
      width: 100%;           /* بدون مسافة */
      padding: 12px;         /* بدون مسافة */
      border: none;
      background: none;
      color: #fff;
      text-align: left;
      cursor: pointer;
    }
    .sidebar button:hover {
      background: #34495e;
    }
    /* Main Content */
    .main {
      flex: 1;
      padding: 20px;         /* بدون مسافة */
    }
    h2 {
      margin-bottom: 20px;   /* بدون مسافة */
      color: #2c3e50;
    }
    .form-section {
      margin-bottom: 20px;   /* بدون مسافة */
    }
    .form-section h3 {
      margin-bottom: 10px;   /* بدون مسافة */
      color: #34495e;
    }
    label {
      display: block;
      margin: 8px 0 4px;     /* بدون مسافة */
    }
    input, select {
      width: 100%;           /* بدون مسافة */
      padding: 8px;          /* بدون مسافة */
      margin-bottom: 12px;   /* بدون مسافة */
      border: 1px solid #ccc;/* بدون مسافة */
      border-radius: 4px;    /* بدون مسافة */
    }
    .buttons {
      margin-top: 20px;      /* بدون مسافة */
    }
    .buttons button {
      padding: 10px 20px;    /* بدون مسافة */
      margin-right: 10px;    /* بدون مسافة */
      border: none;
      border-radius: 4px;    /* بدون مسافة */
      cursor: pointer;
    }
    .register {
      background: #27ae60;
      color: #fff;
    }
    .cancel {
      background: #e74c3c;
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <button>Dashboard</button>
    <button>Students</button>
    <button>Courses</button>
    <button>Reports</button>
    <button>Settings</button>
    <button>Logout</button>
  </div>

  <!-- Main Content -->
  <div class="main">
    <!-- Personal Information -->
    <div class="form-section">
      <h3>Personal Information</h3>
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" placeholder="Enter full name">

      <label for="studentid">Student ID</label>
      <input type="text" id="studentid" placeholder="Enter student ID">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email">

      <label for="phone">Phone</label>
      <input type="tel" id="phone" placeholder="Enter phone">
    </div>

    <!-- Academic Information -->
    <div class="form-section">
      <h3>Academic Information</h3>
      <label for="program">Program</label>
      <select id="program">
        <option value="">Select program</option>
        <option value="CS">Computer Science</option>
        <option value="IT">Information Technology</option>
        <option value="ENG">Engineering</option>
      </select>

      <label for="level">Level</label>
      <select id="level">
        <option value="">Select level</option>
        <option value="Undergraduate">Undergraduate</option>
        <option value="Postgraduate">Postgraduate</option>
      </select>
    </div>

    <!-- Buttons -->
    <div class="buttons">
      <button class="register" onclick="registerStudent()">Register</button>
      <button class="cancel" onclick="cancelForm()">Cancel</button>
    </div>
  </div>

  <script>
    function registerStudent() {
      const fullname = document.getElementById('fullname').value;
      const studentid = document.getElementById('studentid').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const program = document.getElementById('program').value;
      const level = document.getElementById('level').value;

      if (!fullname || !studentid || !email || !phone || !program || !level) {
        alert("⚠️ Please fill all fields!");
        return;
      }

      alert(`✅ Student Registered:\nName: ${fullname}\nID: ${studentid}\nEmail: ${email}\nPhone: ${phone}\nProgram: ${program}\nLevel: ${level}`);
    }

    function cancelForm() {
      document.getElementById('fullname').value = "";
      document.getElementById('studentid').value = "";
      document.getElementById('email').value = "";
      document.getElementById('phone').value = "";
      document.getElementById('program').value = "";
      document.getElementById('level').value = "";
      alert("❌ Form cleared!");
    }
  </script>
</body>
