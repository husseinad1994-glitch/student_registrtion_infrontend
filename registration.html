<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      background-color: #3498db; /* أزرق فاتح */
      color: #ffffff;           /* أبيض */
    }
    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: #2c3e50; /* أزرق غامق */
      color: #ffffff;
      height: 100vh;
      padding-top: 20px;
    }
    .sidebar button {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      background: none;
      color: #ffffff;
      text-align: left;
      cursor: pointer;
      font-weight: bold;
    }
    .sidebar button:hover {
      background-color: #1abc9c; /* أخضر فاتح عند المرور */
    }
    /* Main Content */
    .main {
      flex: 1;
      padding: 20px;
    }
    .form-section {
      margin-bottom: 20px;
      background-color: #2980b9; /* أزرق متوسط */
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .form-section h3 {
      margin-bottom: 10px;
      color: #ecf0f1; /* أبيض فاتح */
    }
    label {
      display: block;
      margin: 8px 0 4px;
      font-weight: bold;
      color: #ffffff;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ffffff;
      border-radius: 6px;
      font-size: 14px;
      background-color: #ecf0f1;
      color: #2c3e50;
    }
    .buttons {
      margin-top: 20px;
    }
    .buttons button {
      padding: 10px 20px;
      margin-right: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    .register {
      background-color: #27ae60; /* أخضر */
      color: #fff;
    }
    .register:hover {
      background-color: #1e8449;
    }
    .cancel {
      background-color: #e74c3c; /* أحمر */
      color: #fff;
    }
    .cancel:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <button onclick="changeLanguage('ar')">العربية</button>
    <button onclick="changeLanguage('en')">English</button>
    <button id="dashboard">Dashboard</button>
    <button id="students">Students</button>
    <button id="courses">Courses</button>
    <button id="reports">Reports</button>
    <button id="settings">Settings</button>
    <button id="logout">Logout</button>
  </div>

  <!-- Main Content -->
